<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add Staff</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-header bg-primary text-white">
            <h3>Add New Staff</h3>
        </div>

        <div class="card-body">
            {% with messages = get_flashed_messages(with_categories=true) %}
               {% if messages %}
                    {% for category, message in messages %}
                        <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
                           {{ message }}
                           <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                        </div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <form method="POST">

                <div class="mb-3">
                    <label>Staff Code</label>
                    <input type="text" name="staff_code" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label>Staff Name</label>
                    <input type="text" name="staff_name" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label>Department</label>
                    <select name="department" class="form-control" required>
                    <option value="">Select Department</option>
                    <option value="Computer Science Engineering">CSE</option>
                    <option value="Information Technology">IT</option>
                    <option value="Artificial Intelligence and Machine Learning">AIML</option>
                    <option value="Cyber Security">Cyber Security</option>
                    <option value="Electronics and Communication Engineering">ECE</option>
                    <option value="Electrical and Electronics Engineering">EEE</option>
                    <option value="Mechanical Engineering">Mechanical</option>
                    <option value="Food Technology">Food Technology</option>
                    <option value="Robotics">Robotics</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label>Email</label>
                    <input type="email" name="email" class="form-control">
                </div>

                <div class="mb-3">
                    <label>Phone</label>
                    <input type="text" name="phone" class="form-control">
                </div>

                <div class="mb-3">
                    <label>Password</label>
                    <input type="password" name="password" class="form-control" required>
                </div>

                <button class="btn btn-success">Save Staff</button>
                <a href="/admin_dashboard" class="btn btn-secondary">Back</a>

            </form>

        </div>

    </div>

</div>

</body>
</html>
