<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Student</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/admin.css') }}">
</head>

<body>

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-header bg-primary text-white">
            <h3>Edit Student</h3>
        </div>

        <div class="card-body">

            <form method="POST">

                <div class="mb-3">
                    <label>Register Number</label>

                    <input type="text"
                           name="register_number"
                           class="form-control"
                           value="{{ student.register_number }}"
                           required>
                </div>

                <div class="mb-3">
                    <label>Student Name</label>

                    <input type="text"
                           name="student_name"
                           class="form-control"
                           value="{{ student.student_name }}"
                           required>
                </div>

                <div class="mb-3">

                    <label>Department</label>

                    <select name="department"
                            class="form-control"
                            required>

                        <option value="">Select Department</option>

                        {% for dept in departments %}

                        <option value="{{ dept.department_name }}"
                            {% if dept.department_id == student.department_id %}
                                selected
                            {% endif %}>

                            {{ dept.department_name }}

                        </option>

                        {% endfor %}

                    </select>

                </div>

                <div class="mb-3">

                    <label>Year</label>

                    <input type="number"
                           name="year"
                           class="form-control"
                           min="1"
                           max="4"
                           value="{{ student.year_of_study }}"
                           required>

                </div>

                <div class="mb-3">

                    <label>Email</label>

                    <input type="email"
                           name="email"
                           class="form-control"
                           value="{{ student.email }}"
                           required>

                </div>

                <div class="mb-3">

                    <label>Phone</label>

                    <input type="text"
                           name="phone"
                           class="form-control"
                           value="{{ student.phone }}"
                           required>

                </div>

                <button type="submit"
                        class="btn btn-success">

                    Update Student

                </button>

                <a href="/students"
                   class="btn btn-secondary">

                    Back

                </a>

            </form>

        </div>

    </div>

</div>

</body>
</html>
