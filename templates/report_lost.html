<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Report Lost Item</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/student.css') }}">
</head>

<body>

<div class="container mt-5">

    <div class="card shadow p-4">

        <h2 class="mb-4">
            <i class="bi bi-exclamation-circle"></i>
            Report Lost Item
        </h2>

        <form action="/report_lost"
              method="POST"
              enctype="multipart/form-data">
            
            {% if session.get('admin_id') %}
            <div class="mb-3">
                <label class="form-label">Select Student</label>

                <select name="student_id" class="form-select" required>
                    <option value="">Select Student</option>

                    {% for student in students %}
                    <option value="{{ student.student_id }}">
                        {{ student.register_number }} - {{ student.student_name }}
                    </option>
                    {% endfor %}

                </select>
            </div>
            {% endif %}  
            <!-- Item Name -->

            <div class="mb-3">
                <label for="item_name" class="form-label">Item Name</label>

            <input
                type="text"
                class="form-control"
                id="item_name"
                name="item_name"
                placeholder="Enter lost item name"
                required
            >
            </div>
            <!-- Category -->
            <div class="mb-3">
                <label class="form-label">Category</label>

                <select name="category"
                        class="form-select"
                        required>

                    <option value="">Select Category</option>
                    <option value="Electronics">Electronics</option>
                    <option value="Documents">Documents</option>
                    <option value="Books">Books</option>
                    <option value="Clothing">Clothing</option>
                    <option value="Accessories">Accessories</option>
                    <option value="Others">Others</option>

                </select>
            </div>


            <!-- Description -->
            <div class="mb-3">
                <label class="form-label">Description</label>

                <textarea name="description"
                          class="form-control"
                          rows="4"
                          placeholder="Describe the lost item"
                          required></textarea>
            </div>


            <!-- Lost Location -->
            <div class="mb-3">
                <label class="form-label">Lost Location</label>

                <input type="text"
                       name="lost_location"
                       class="form-control"
                       placeholder="Where did you lose it?"
                       required>
            </div>


            <!-- Lost Date -->
            <div class="mb-3">
                <label class="form-label">Lost Date</label>

                <input type="date"
                       name="lost_date"
                       class="form-control"
                       required>
            </div>


            <!-- Item Image -->
            <div class="mb-3">
                <label class="form-label">Item Image</label>

                <input type="file"
                       name="item_image"
                       class="form-control"
                       accept="image/*">

                <small class="text-muted">
                    Upload an image of the lost item
                </small>
            </div>


            <!-- Buttons -->
            <div class="mt-4">

                <button type="submit"
                        class="btn btn-danger">
                    <i class="bi bi-send"></i>
                    Report Lost Item
                </button>

                <a href="/admin_dashboard"
                   class="btn btn-secondary">
                    <i class="bi bi-arrow-left"></i>
                    Back to dashboard
                </a>

            </div>

        </form>

    </div>

</div>

</body>
</html>
