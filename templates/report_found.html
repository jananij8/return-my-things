<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Report Found Item</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-header bg-success text-white">
            <h3>Report Found Item</h3>
        </div>

        <div class="card-body">

            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="alert alert-{{ category }}">
                            {{ message }}
                        </div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <form method="POST"
                action="/report_found"
                enctype="multipart/form-data">

                <div class="mb-3">
                    <label class="form-label">Item Name</label>
                    <input type="text" name="item_name" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Category</label>

                    <select name="category" id="category" class="form-control" onchange="showOtherCategory()" required>
                        <option value="">Select Category</option>
                        <option value="Mobile">Mobile</option>
                        <option value="Laptop">Laptop</option>
                        <option value="Bag">Bag</option>
                        <option value="Books">Books</option>
                        <option value="ID Card">ID Card</option>
                        <option value="ATM Card">ATM Card</option>
                        <option value="Keys">Keys</option>
                        <option value="Water Bottle">Water Bottle</option>
                        <option value="Watch">Watch</option>
                        <option value="Documents">Documents</option>
                        <option value="Others">Others</option>
                    </select>
                </div>

                <div class="mb-3" id="otherCategoryDiv" style="display:none;">
                    <label class="form-label">Enter Category</label>
                    <input type="text" id="otherCategory" class="form-control" placeholder="Enter Category">
                </div>

                <script>
                function showOtherCategory() {
                    var category = document.getElementById("category").value;
                    var otherDiv = document.getElementById("otherCategoryDiv");
                    var otherInput = document.getElementById("otherCategory");

                    if (category === "Others") {
                        otherDiv.style.display = "block";
                        otherInput.setAttribute("name", "category");
                    } else {
                        otherDiv.style.display = "none";
                        otherInput.removeAttribute("name");
                    }
                }
                </script>

                <div class="mb-3">
                    <label class="form-label">Description</label>
                    <textarea name="description" class="form-control" rows="3"></textarea>
                </div>

                <div class="mb-3">
                    <label class="form-label">Found Location</label>
                    <input type="text" name="found_location" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Found Date</label>
                    <input type="date" name="found_date" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Item Image</label>

                    <input type="file"
                        name="item_image"
                        class="form-control"
                        accept="image/*">

                    <small class="text-muted">
                        Upload an image of the found item
                    </small>
                </div>
                <button type="submit" class="btn btn-success">
                    Report Found Item
                </button>

                <a href="/my_found_items" class="btn btn-secondary">
                    Back
                </a>

            </form>

        </div>

    </div>

</div>

</body>
</html>
