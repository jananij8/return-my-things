<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Student</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}">
</head>

<body>

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-header bg-primary text-white">
            <h3>Add New Student</h3>
        </div>

        <div class="card-body">

            <form method="POST">

                <div class="mb-3">
                    <label>Register Number</label>
                    <input type="text" class="form-control" name="register_number" required>
                </div>

                <div class="mb-3">
                    <label>Student Name</label>
                    <input type="text" class="form-control" name="student_name" required>
                </div>

                <div class="mb-3">
                    <label>Department</label>
                    <select class="form-control" name="department" required>
    <option value="">Select Department</option>
    <option value="Computer Science Engineering">CSE</option>
    <option value="Information Technology">IT</option>
    <option value="Electronics and Communication Engineering">ECE</option>
    <option value="Electrical and Electronics Engineering">EEE</option>
    <option value="Mechanical Engineering">MEC</option>
    <option value="Civil Engineering">Civil</option>
    <option value="Artificial Intelligence and Machine Learning">AIML</option>
    <option value="Cyber Security">Cyber Security</option>
    <option value="Food Technology">Food Technology</option>
    <option value="Robotics">Robotics</option>
</select>
                </div>

                <div class="mb-3">
                    <label>Year</label>
                    <input type="number" class="form-control" name="year" min="1" max="4" required>
                </div>

                <div class="mb-3">
                    <label>Email</label>
                    <input type="email" class="form-control" name="email" required>
                </div>

                <div class="mb-3">
                    <label>Phone</label>
                    <input type="text" class="form-control" name="phone" required>
                </div>
                <div class="mb-3">
                <label>Password</label>
                <input type="password" class="form-control" name="password" required>
                </div>

                <button type="submit" class="btn btn-success">
                    Save Student
                </button>

                <a href="/students" class="btn btn-secondary">
                    Back
                </a>

            </form>

        </div>

    </div>

</div>

</body>
</html>
