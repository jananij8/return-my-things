<!DOCTYPE html>
<html>
<head>
    <title>Department Items</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<div class="container mt-5">

<h2>Department Items</h2>

<table class="table table-bordered">

<tr>
    <th>Lost ID</th>
    <th>Student</th>
    <th>Item</th>
    <th>Category</th>
    <th>Status</th>
</tr>

{% for item in items %}
<tr>

    <td>{{ item.lost_id }}</td>
    <td>{{ item.student_name }}</td>
    <td>{{ item.item_name }}</td>
    <td>{{ item.category }}</td>
    <td>{{ item.status }}</td>

</tr>
{% endfor %}

</table>

<a href="/staff_dashboard" class="btn btn-primary">
Back
</a>

</div>

</body>
</html>
